name: Publicar Central de Cuidado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # O BANCO VEM PRIMEIRO, e tudo o mais depende dele.
  #
  # Antes as migrations rodavam DEPOIS de publicar as Edge Functions, no mesmo
  # trabalho, e o site subia em paralelo sem depender de nenhum dos dois. Isso
  # garantia uma janela em que o codigo novo conversava com o banco velho.
  #
  # Em 17/09/2026 a janela deixou de ser janela e virou buraco: uma migration
  # com erro de SQL (min(uuid), que o Postgres nao tem) falhou, e como o
  # db push para na primeira que falha, TRES DIAS de alteracoes de banco
  # ficaram paradas. O site e as funcoes continuaram subindo normalmente, sem
  # as colunas que pediam. O robo respondeu o menu tres vezes seguidas para uma
  # paciente de verdade, e nada no processo acusou.
  #
  # Agora e simples: migration falhou, nada vai ao ar. A publicacao fica
  # vermelha e a producao continua inteira, rodando a versao anterior.
  banco:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: favohmryseurvnlxocfc
    outputs:
      token: ${{ steps.token.outputs.presente }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Conferir se o token esta configurado
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN nao foi configurado nos secrets do repositorio. O banco e as Edge Functions nao serao publicados."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar a CLI do Supabase
        if: steps.token.outputs.presente == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Aplicar migrations do banco
        if: steps.token.outputs.presente == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD nao configurado. As migrations nao serao aplicadas automaticamente."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

  build:
    runs-on: ubuntu-latest
    env:
      # A chave publishable faz parte do frontend público. Nunca use service_role aqui.
      VITE_SUPABASE_URL: https://favohmryseurvnlxocfc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WrOPPL7wfcBEal3ewj-3qg_888iAHj3
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar o projeto
        run: npm run lint

      - name: Gerar a versao de producao
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicacao
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Tambem espera o banco: pagina nova com schema velho e o defeito que esta
    # regra existe para impedir.
    needs: [build, banco]
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # As Edge Functions nao faziam parte da publicacao. Por causa disso a funcao
  # rodando em producao ficou horas mais antiga que o codigo do repositorio, e o
  # sistema exibia um erro que ja estava corrigido aqui. Publicar as duas coisas
  # juntas impede que isso volte a acontecer.
  funcoes:
    runs-on: ubuntu-latest
    needs: banco
    if: needs.banco.outputs.token == 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: favohmryseurvnlxocfc
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Conferir se o token esta configurado
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN nao foi configurado nos secrets do repositorio. As Edge Functions nao serao publicadas."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar a CLI do Supabase
        if: steps.token.outputs.presente == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar as Edge Functions
        if: steps.token.outputs.presente == 'true'
        run: |
          supabase functions deploy whatsapp-send --project-ref "$PROJECT_REF"
          supabase functions deploy meta-webhook --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-dispatch --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-reply --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-reopen --project-ref "$PROJECT_REF"
          supabase functions deploy appointment-reminders --project-ref "$PROJECT_REF"
          supabase functions deploy transcrever-audio --project-ref "$PROJECT_REF"
          supabase functions deploy assinar-consulta --project-ref "$PROJECT_REF"
          supabase functions deploy appointment-cancel --project-ref "$PROJECT_REF"
          supabase functions deploy whatsapp-perfil --project-ref "$PROJECT_REF"
          supabase functions deploy memed-prescritor --project-ref "$PROJECT_REF"
          supabase functions deploy memed-receita --project-ref "$PROJECT_REF"
