name: Publicar Central de Cuidado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A chave publishable faz parte do frontend público. Nunca use service_role aqui.
      VITE_SUPABASE_URL: https://favohmryseurvnlxocfc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WrOPPL7wfcBEal3ewj-3qg_888iAHj3
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar o projeto
        run: npm run lint

      - name: Gerar a versao de producao
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicacao
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
