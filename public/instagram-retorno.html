<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Central de Cuidado</title>
  </head>
  <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f7f4;color:#081b2c;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
    <p style="font-size:15px">Voltando para a Central de Cuidado…</p>
    <script>
      /*
       * Volta do login do Instagram (16/10/2026). O Instagram devolve ?code= e
       * ?state=, os mesmos nomes da volta da assinatura digital (VIDaaS) na
       * Central: la, um "state" abre Pacientes e tenta concluir assinatura. Esta
       * pagina repassa com nomes proprios, e quem conclui e o cartao do
       * Instagram em Preferencias (src/lib/instagram.ts).
       */
      ;(function () {
        var p = new URLSearchParams(window.location.search)
        var q = new URLSearchParams()
        var code = (p.get('code') || '').replace(/#_?$/, '')
        if (code) q.set('instagram_code', code)
        if (p.get('state')) q.set('instagram_state', p.get('state'))
        if (p.get('error')) q.set('instagram_erro', p.get('error_description') || p.get('error_reason') || p.get('error'))
        if (!code && !p.get('error')) q.set('instagram_erro', 'o Instagram voltou sem o código do login')
        window.location.replace('./?' + q.toString() + '#/')
      })()
    </script>
  </body>
</html>
